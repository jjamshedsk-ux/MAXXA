name: Build MAXXA AI Complete Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MAXXA AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK ZIP
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/MAXXA-AI-debug.apk
          cd release
          zip MAXXA-AI-APK.zip MAXXA-AI-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAXXA-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAXXA-AI-APK-ZIP
          path: release/MAXXA-AI-APK.zip
          if-no-files-found: error
          retention-days: 7
