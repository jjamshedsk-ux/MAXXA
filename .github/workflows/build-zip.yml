name: Build MAXXA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted: $ZIP_FILE"

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS="$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) missing from ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app module missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: Root build.gradle(.kts) missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/MAXXA-AI-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAXXA-AI-debug-apk
          path: apk-output/MAXXA-AI-debug.apk
          if-no-files-found: error
          retention-days: 7
