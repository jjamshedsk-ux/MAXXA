name: Build MAXXA AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MAXXA_AI_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract MAXXA AI project
        run: unzip -o MAXXA_AI_Project.zip

      - name: Build debug APK
        working-directory: MAXXA_AI_Project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAXXA-AI-APK
          path: MAXXA_AI_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

