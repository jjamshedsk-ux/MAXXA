name: Build MAXXA AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MAXXA_AI_Project.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build MAXXA AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Extract project ZIP
        run: |
          unzip -o MAXXA_AI_Project.zip
          test -f MAXXA_AI_Project/app/build.gradle.kts

      - name: Fix Kotlin JVM target
        working-directory: MAXXA_AI_Project
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          // Match Kotlin target to Java 1.8
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }
          EOF

      - name: Build debug APK
        working-directory: MAXXA_AI_Project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAXXA-AI-APK
          path: MAXXA_AI_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
